##
## HamdyZone — Nginx site config
## Copy to: /etc/nginx/sites-available/hamdyzone.icu
## Then: ln -s /etc/nginx/sites-available/hamdyzone.icu /etc/nginx/sites-enabled/
##

server {
    listen 80;
    listen [::]:80;
    server_name hamdyzone.icu www.hamdyzone.icu;

    root /var/www/html/hamdyzone.icu;
    index index.html;

    # Basic hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff2;

    # Static assets cache
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Allow ACME challenge for later SSL issuance
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block sensitive paths
    location ~* (\.git|\.env|\.htaccess|wp-admin|xmlrpc\.php) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/hamdyzone.icu.access.log;
    error_log  /var/log/nginx/hamdyzone.icu.error.log;
}
